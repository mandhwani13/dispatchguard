<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}DispatchGuard - Warehouse Dispatch & Gate Pass{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Print Stylesheet -->
    <link rel="stylesheet" href="/static/css/print.css">

    <style>
        /* Smooth touch scrolling */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased select-none sm:select-auto pb-16 sm:pb-0">

    <!-- Top Navigation Bar -->
    <header class="no-print sticky top-0 z-40 bg-slate-900 border-b border-slate-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand / Logo -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-2 text-white hover:text-emerald-400 transition-colors">
                        <div class="w-9 h-9 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-black shadow">
                            <i data-lucide="shield-check" class="w-6 h-6 stroke-[2.5]"></i>
                        </div>
                        <div>
                            <span class="text-xl font-bold tracking-tight">Dispatch<span class="text-emerald-400">Guard</span></span>
                            <span class="hidden sm:inline-block text-[10px] uppercase tracking-wider bg-slate-800 text-slate-300 font-semibold px-2 py-0.5 rounded ml-2 border border-slate-700">Warehouse OS</span>
                        </div>
                    </a>
                </div>

                <!-- Desktop Nav Links -->
                <nav class="hidden md:flex items-center space-x-2">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800 transition-colors flex items-center space-x-1.5">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        <span>Dispatches</span>
                    </a>
                    <a href="/scanner" class="px-3 py-2 rounded-md text-sm font-medium text-emerald-300 bg-emerald-950/60 hover:bg-emerald-900/60 border border-emerald-800/80 transition-colors flex items-center space-x-1.5">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                        <span>Dock Scanner</span>
                    </a>
                </nav>

                <!-- Actions -->
                <div class="flex items-center space-x-2.5">
                    <button onclick="openNewOrderModal()" class="inline-flex items-center space-x-1.5 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-slate-950 font-semibold text-xs sm:text-sm px-3.5 py-2 rounded-lg shadow-sm transition-colors">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>New Dispatch</span>
                    </button>
                    <a href="/api/demo/seed" class="hidden sm:inline-flex items-center text-xs text-slate-400 hover:text-slate-200 bg-slate-800 border border-slate-700 px-2.5 py-2 rounded-lg" title="Reset Demo Orders">
                        <i data-lucide="database" class="w-3.5 h-3.5 mr-1"></i>
                        <span>Seed Data</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Navigation Bar for Mobile Phones (Thumb Reachable) -->
    <div class="no-print fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-800 flex justify-around items-center h-14 md:hidden text-slate-400">
        <a href="/" class="flex flex-col items-center justify-center flex-1 h-full hover:text-emerald-400 active:text-emerald-400 transition-colors">
            <i data-lucide="truck" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium">Orders</span>
        </a>
        <a href="/scanner" class="flex flex-col items-center justify-center flex-1 h-full text-emerald-400 font-bold">
            <div class="bg-emerald-500 text-slate-950 p-2 rounded-full -mt-5 shadow-lg border-2 border-slate-900">
                <i data-lucide="scan" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] mt-0.5">Scan Dock</span>
        </a>
        <button onclick="openNewOrderModal()" class="flex flex-col items-center justify-center flex-1 h-full hover:text-emerald-400 active:text-emerald-400 transition-colors">
            <i data-lucide="plus-square" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium">Create</span>
        </button>
    </div>

    <!-- Modal: New Dispatch Order -->
    <div id="newOrderModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
                        <i data-lucide="truck" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900">Create Dispatch Order</h3>
                </div>
                <button onclick="closeNewOrderModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="newOrderForm" method="POST" action="/api/orders" class="space-y-4 mt-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Order # / Invoice ID *</label>
                        <input type="text" name="order_number" id="order_number" required placeholder="e.g. DG-2026-1044" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none uppercase font-mono font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Customer / Party Name *</label>
                        <input type="text" name="customer_name" id="customer_name" required placeholder="e.g. Apex Global Stores" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Transporter / Carrier</label>
                        <input type="text" name="transporter_name" id="transporter_name" placeholder="e.g. BlueDart Logistics" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Vehicle Registration #</label>
                        <input type="text" name="vehicle_number" id="vehicle_number" placeholder="e.g. MH-04-AB-9821" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none uppercase font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Total Expected Cartons *</label>
                        <input type="number" name="expected_cartons" id="expected_cartons" min="1" required placeholder="e.g. 12" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base font-bold text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Total Expected Pieces *</label>
                        <input type="number" name="expected_pieces" id="expected_pieces" min="1" required placeholder="e.g. 600" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base font-bold text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeNewOrderModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center space-x-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        <span>Create Dispatch</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openNewOrderModal() {
            document.getElementById('newOrderModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('order_number').focus(), 100);
        }
        function closeNewOrderModal() {
            document.getElementById('newOrderModal').classList.add('hidden');
        }
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
