# Render Blueprint Specification for DispatchGuard
databases:
  - name: dispatchguard-db
    databaseName: dispatchguard
    user: dispatchuser
    plan: starter

services:
  - type: web
    name: dispatchguard-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatchguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.2
