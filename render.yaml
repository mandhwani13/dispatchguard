# Render Blueprint Specification for DispatchGuard (100% Free Tier)
services:
  - type: web
    name: dispatchguard-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.2
      # Optional: To use external free PostgreSQL (e.g., Neon.tech / Supabase / Render Postgres),
      # set DATABASE_URL in Render Dashboard Environment settings.
      # If unset, DispatchGuard automatically uses zero-config SQLite.
